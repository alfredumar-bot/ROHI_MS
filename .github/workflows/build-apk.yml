name: Build ROHI Attendance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache

      - name: Install Rust (required for cryptography package cross-compile)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set JAVA_HOME to JDK 17 (Android Gradle plugin requires it)
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install "cython==0.29.34"

      # Cache the Android SDK/NDK + build artifacts so re-runs after the
      # first successful build take minutes instead of ~20+.
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Cache Buildozer project build directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ hashFiles('buildozer.spec') }}

      - name: Decode release keystore
        env:
          ROHI_KEYSTORE_BASE64: ${{ secrets.ROHI_KEYSTORE_BASE64 }}
        run: |
          echo "$ROHI_KEYSTORE_BASE64" | base64 -d > rohi-release-key.keystore

      - name: Upload keystore for inspection
        uses: actions/upload-artifact@v4
        with:
          name: keystore-debug
          path: rohi-release-key.keystore

      - name: Build signed release APK
        env:
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/rohi-release-key.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ROHI_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ROHI_KEYSTORE_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ROHI_KEYSTORE_PASSWORD }}
        run: |
          yes | buildozer android release

      - name: Remove decoded keystore
        if: always()
        run: rm -f rohi-release-key.keystore

      - name: Find APK
        run: |
          echo "Generated APK files:"
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROHI-Attendance-APK
          path: bin/*.apk
          if-no-files-found: error
